<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>svg-lint · validátor omaľovánkových SVG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #0d1117;
    --bg-2:      #0a0d12;
    --panel:     #161b22;
    --panel-2:   #1c2129;
    --panel-3:   #22272e;
    --border:    #30363d;
    --border-2:  #21262d;
    --fg:        #e6edf3;
    --fg-2:      #9ba6b3;
    --fg-3:      #6e7681;
    --error:     #f85149;
    --warning:   #d29922;
    --info:      #58a6ff;
    --success:   #3fb950;
    --accent:    #a371f7;
    --mono:      'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:      'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ============== APP layout ============== */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ============== TOPBAR ============== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--mono);
  }
  .brand-mark {
    color: var(--success);
    font-size: 12px;
    align-self: center;
    text-shadow: 0 0 8px var(--success);
  }
  .brand-name {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.2px;
  }
  .brand-sub {
    color: var(--fg-3);
    font-size: 12px;
    font-weight: 400;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .file-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .file-icon {
    color: var(--accent);
  }
  .file-meta {
    color: var(--fg-3);
    margin-left: 6px;
    padding-left: 8px;
    border-left: 1px solid var(--border);
  }

  /* ============== Buttons ============== */
  .btn-primary, .btn-secondary, .btn-ghost {
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid transparent;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    font-family: var(--sans);
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover:not(:disabled) { background: #b386f9; border-color: #b386f9; }
  .btn-primary:disabled {
    background: var(--panel-3);
    color: var(--fg-3);
    border-color: var(--border);
    cursor: not-allowed;
  }
  .btn-secondary {
    background: var(--panel-2);
    color: var(--fg);
    border-color: var(--border);
  }
  .btn-secondary:hover { background: var(--panel-3); border-color: var(--fg-3); }
  .btn-ghost {
    background: transparent;
    color: var(--fg-2);
    border-color: var(--border);
  }
  .btn-ghost:hover { background: var(--panel); color: var(--fg); }

  /* ============== EMPTY STATE ============== */
  .empty-main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    padding: 48px 60px;
    overflow: auto;
    align-content: center;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }
  .dropzone {
    background: var(--panel);
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 64px 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    min-height: 360px;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent);
    background: var(--panel-2);
  }
  .dropzone-icon { margin-bottom: 20px; }
  .dropzone-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .dropzone-sub {
    color: var(--fg-3);
    font-size: 14px;
  }
  .empty-help {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 36px;
    min-height: 360px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .empty-help-title {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--fg-3);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .empty-help ul {
    margin: 0;
    padding-left: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty-help li {
    padding-left: 22px;
    position: relative;
    line-height: 1.55;
    font-size: 14px;
  }
  .empty-help li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 600;
  }

  /* ============== WORKSPACE ============== */
  .work {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr);
    min-height: 0;
    overflow: hidden;
  }

  /* ============== LINT PANE ============== */
  .lint-pane {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-height: 0;
  }
  .lint-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .lint-summary {
    display: flex;
    gap: 18px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
  }
  .count {
    color: var(--fg-3);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .count.on { color: var(--fg); }
  .count .sev-icon { font-size: 14px; }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--fg-2);
    cursor: pointer;
    user-select: none;
  }
  .toggle input { accent-color: var(--accent); }

  .lint-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  .preprocess-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    margin: 10px 14px 4px;
    background: rgba(163,113,247,0.10);
    border: 1px solid rgba(163,113,247,0.4);
    border-radius: 6px;
    color: var(--fg);
    font-size: 12.5px;
    line-height: 1.45;
  }
  .lineart-banner {
    background: rgba(63,185,80,0.10);
    border-color: rgba(63,185,80,0.4);
  }
  .lineart-banner a { color: var(--info); }
  .preprocess-banner code {
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .preprocess-icon {
    color: var(--accent);
    font-size: 16px;
    flex-shrink: 0;
  }
  .banner-close {
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--fg-3);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
  }
  .banner-close:hover { color: var(--fg); }
  .lint-clean {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 20px;
    color: var(--fg-2);
    text-align: center;
  }
  .clean-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(63,185,80,0.12);
    color: var(--success);
    display: grid;
    place-items: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .clean-title { font-size: 17px; font-weight: 600; color: var(--fg); }
  .clean-sub { color: var(--fg-3); font-size: 13px; margin-top: 4px; }

  /* ============== Issue rows ============== */
  .issue {
    padding: 10px 18px;
    cursor: pointer;
    border-left: 3px solid transparent;
    border-bottom: 1px solid var(--border-2);
    transition: background 0.1s;
  }
  .issue:hover { background: var(--panel); }
  .issue.active { background: var(--panel-2); }
  .issue.sev-error.active   { border-left-color: var(--error); }
  .issue.sev-warning.active { border-left-color: var(--warning); }
  .issue.sev-info.active    { border-left-color: var(--info); }

  .issue-line {
    display: grid;
    grid-template-columns: 110px 1fr auto;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .sev-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    justify-self: start;
  }
  .sev-pill.sev-error   { background: rgba(248,81,73,0.12);  color: var(--error); }
  .sev-pill.sev-warning { background: rgba(210,153,34,0.14); color: var(--warning); }
  .sev-pill.sev-info    { background: rgba(88,166,255,0.12); color: var(--info); }
  .sev-pill.inline { padding: 1px 6px; font-size: 10px; vertical-align: middle; margin: 0 2px; }
  .sev-icon { font-weight: 700; }
  .sev-icon.sev-error { color: var(--error); }
  .sev-icon.sev-warning { color: var(--warning); }
  .sev-icon.sev-info { color: var(--info); }

  .issue-title {
    color: var(--fg);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .issue-rule {
    color: var(--fg-3);
    font-family: var(--mono);
    font-size: 11.5px;
  }

  .issue-detail {
    margin-top: 10px;
    padding: 12px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    border-radius: 6px;
  }
  .issue-detail p {
    margin: 0 0 8px;
    color: var(--fg-2);
    font-size: 13px;
    line-height: 1.55;
  }
  .snippet {
    background: #07090c;
    border: 1px solid var(--border-2);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: #c9d1d9;
    margin: 4px 0;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .hint {
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--info);
    font-family: var(--mono);
  }
  .fix-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 8px;
    background: rgba(163,113,247,0.14);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    border-radius: 4px;
  }

  .lint-footer {
    display: flex;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    background: var(--bg-2);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .lint-footer .btn-primary { flex: 1 1 100%; }
  .lint-footer .btn-secondary { flex: 1 1 0; min-width: 110px; }

  /* ============== PREVIEW PANE ============== */
  .preview-pane {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .preview-label {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
  }
  .preview-hint {
    color: var(--fg-3);
    font-size: 12px;
  }

  /* ============== Palette ============== */
  .palette {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 18px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .swatch {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    transition: transform 0.1s, border-color 0.1s;
    position: relative;
  }
  .swatch:hover { transform: translateY(-2px); }
  .swatch.on {
    border-color: var(--fg);
    box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 4px var(--fg);
  }
  .swatch-white {
    border: 2px solid var(--border) !important;
  }
  .swatch-white.on { border-color: var(--fg) !important; }
  .swatch-erase {
    background: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  /* odstránená oblasť: v náhľade sivá, aby bolo vidno, čo sa nebude vyfarbovať */
  .svg-preview-canvas svg [data-removed-region] {
    fill: #d0d7de;
    cursor: pointer;
  }

  /* ============== Preview frame ============== */
  .preview-frame {
    flex: 1;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    container-type: size;
    background:
      linear-gradient(45deg, #0a0d12 25%, transparent 25%),
      linear-gradient(-45deg, #0a0d12 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #0a0d12 75%),
      linear-gradient(-45deg, transparent 75%, #0a0d12 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    background-color: #12161c;
    min-height: 0;
    overflow: hidden;
  }
  .svg-preview-canvas {
    width: min(100cqw, 100cqh);
    height: min(100cqw, 100cqh);
    aspect-ratio: 1 / 1;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .svg-preview-canvas svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* runtime atribút pre pointer-events: none — nepoužívame inline style,
     aby validátor nehlásil false-positive "inline style" */
  .svg-preview-canvas svg [data-pe="none"] {
    pointer-events: none;
  }

  .preview-footer {
    padding: 10px 18px;
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    color: var(--fg-3);
    font-size: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  /* ============== Počítadlo vyfarbených oblastí ============== */
  .region-counter {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .rc-bar {
    width: 84px;
    height: 6px;
    border-radius: 3px;
    background: var(--panel-3);
    overflow: hidden;
    border: 1px solid var(--border-2);
  }
  .rc-fill {
    height: 100%;
    background: var(--success);
    border-radius: 3px;
    transition: width 0.2s ease;
  }
  .rc-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg-2);
    white-space: nowrap;
  }
  .rc-text strong {
    color: var(--success);
    font-weight: 700;
  }
  .rc-sep {
    color: var(--fg-3);
    margin: 0 4px;
  }
  @media (max-width: 520px) {
    .region-counter .rc-bar { display: none; }
  }
  .kbd {
    display: inline-block;
    padding: 1px 6px;
    background: var(--panel-3);
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--fg-2);
    margin-right: 6px;
  }
  .hint-text {
    display: inline-flex;
    align-items: center;
  }

  /* ============== Scrollbar ============== */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-2); }
  ::-webkit-scrollbar-thumb {
    background: var(--panel-3);
    border-radius: 6px;
    border: 2px solid var(--bg-2);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--border); }

  /* ============== Responsive ============== */
  @media (max-width: 820px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100vh; }
    .work {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
    }
    .lint-pane {
      border-right: none;
      border-bottom: 1px solid var(--border);
      max-height: 60vh;
    }
    .preview-pane {
      min-height: 70vh;
    }
    .empty-main {
      grid-template-columns: 1fr;
      padding: 24px;
    }
  }
  @media (max-width: 520px) {
    .palette {
      padding: 10px 12px;
      gap: 6px;
    }
    .swatch { width: 30px; height: 30px; }
    .issue-line {
      grid-template-columns: 86px 1fr;
    }
    .issue-rule { display: none; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="preprocessor.js"></script>
  <script src="region-overlap.js"></script>
  <script src="validators.js"></script>
  <script src="fixer.js"></script>
  <script src="svgo-runner.js"></script>
  <script src="lineart-regions.js"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
